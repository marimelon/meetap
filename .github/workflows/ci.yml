name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build whisper.cpp libs
        run: make libs

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
        env:
          CGO_CFLAGS: -I${{ github.workspace }}/.whisper-cpp/build/include
          CGO_LDFLAGS: -L${{ github.workspace }}/.whisper-cpp/build/lib -lwhisper -lggml -lggml-base -lggml-cpu -lggml-metal -lggml-blas -framework Accelerate -framework Metal -framework Foundation -framework CoreGraphics -lstdc++ -lm

  build:
    name: Build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Verify binary
        run: ./meetap version
